[project]
name = "later-cli"
version = "0.2.2"
description = "A CLI task management tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "kujirahand"}
]
dependencies = [
    "typer>=0.25.1",
    "rich>=15.0.0",
]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Scheduling",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/kujirahand/later-cli"
Repository = "https://github.com/kujirahand/later-cli"
Issues = "https://github.com/kujirahand/later-cli/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "black>=24.10.0",
    "ruff>=0.9.2",
]

[tool.uv]
package = true

[project.scripts]
later = "later:app"

[tool.hatch.build.targets.wheel]
include = [
    "later.py",
    "storage.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "later.py",
    "storage.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
