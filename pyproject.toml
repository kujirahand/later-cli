[project]
name = "later-cli"
version = "0.1.0"
description = "CLIでタスクを管理するプログラム"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "kujirahand"}
]
dependencies = [
    "typer>=0.25.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "black>=24.10.0",
    "ruff>=0.9.2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
